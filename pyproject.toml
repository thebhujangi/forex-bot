[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forexbot"
version = "0.1.0"
description = "Gold & forex signal bot: backtest, demo signals, prop firm."
requires-python = ">=3.12"
dependencies = [
    "MetaTrader5; sys_platform == 'win32'",   # Windows-only; the cloud copy uses web APIs
    "pandas",
    "numpy",
    "pyyaml",
    "plotly",
    "ib_async",                                # Interactive Brokers prices (read-only)
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
