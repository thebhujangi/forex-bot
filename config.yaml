# Forex Bot configuration
# Prices are in the symbol's own units (gold: USD per ounce, EURUSD: USD per EUR, USDJPY: JPY per USD).

account:
  starting_balance: 10000      # USD — matches a $10k prop challenge
  currency: USD

risk:
  risk_per_trade_pct: 1.0      # % of balance lost if the stop loss is hit
  max_open_trades: 3
  max_trades_per_symbol: 1
  # Block a new trade if (today's realised loss + risk of all open trades + this trade)
  # could exceed this % of the day's starting balance. Prop firm limit is usually 5%.
  daily_loss_limit_pct: 4.0

broker:
  name: Elev8
  # How MT5 server times map to real time:
  #   auto       — detect from MT5 while the market is open
  #   eu_dst     — GMT+2 in winter / GMT+3 in summer, clocks change on the EU dates (Elev8)
  #   ny_plus_7  — GMT+2 in winter / GMT+3 in summer, clocks change on the US dates
  #   2, 3, ...  — fixed offset from UTC in hours
  server_time: eu_dst          # Elev8-Demo2: UTC+3 summer / UTC+2 winter on the EU dates (week of 26 Oct 2026
                               # opened Sunday 23:00 server = UTC+2 while New York was still on summer time)

mt5:
  # The bot opens MT5 itself from here if it isn't running (e.g. after a restart).
  terminal_path: C:\Program Files\MetaTrader 5\terminal64.exe

symbols: [XAUUSD, EURUSD, GBPUSD, USDJPY]

# Telegram trading assistant (scripts/run_bot.py). Reads MT5, never places trades.
bot:
  timezone: Asia/Kuala_Lumpur  # times in messages
  watch_symbols: [XAUUSD, EURUSD, GBPUSD]
  news_impacts: [High]         # Forex Factory impact levels to warn about
  news_warning_minutes: 30
  breakeven_at_r: 1.0          # suggest stop to breakeven after price moves 1x your risk
  spike_multiple: 3.0          # 5-min candle this many times normal = alert
  daily_warn_pct: 3.0          # warn at -3% for the day; stop message at risk.daily_loss_limit_pct
  morning_brief: "08:00"       # local time, every weekday
  weekly_report: "20:00"       # local time, every Sunday
  headline_max_per_hour: 4     # pushed "big news" headlines (free RSS feeds)
  headline_quiet_start: "00:30"  # no headline pings overnight (official Fed releases excepted)
  headline_quiet_end: "07:00"
  check_seconds: 30           # cloud copy: how often it looks (free price APIs are rate-limited)
  live_check_seconds: 2        # PC with MT5: looks at Elev8's prices every 2 seconds

# Signal feeds the bot sends. Tested/promising feeds first; the ⚗️ experimental ones (failed
# testing, demo practice only, experimental: true) are at the end.
signals:
  - name: crypto_trend
    strategy: daily_trend
    symbols: [BTCUSD, ETHUSD, XRPUSD]
    horizon: LONG-TERM
    tier: "Promising: passed the unseen 2024-26 test on BTC/ETH/XRP (5 other coins failed it)"
    stats: "Tested on Elev8 prices 2019-2026: 90 trades, wins about 4 in 10, averages +0.35x risk per trade (about +0.3% a month at 1% risk). Unseen 2024-26 still positive."
    # 2026-10-08: SOL/BNB/LTC/DOGE/ADA with the same settings: +0.48R in-sample 2018-23 but
    # -0.13R (PF 0.80, 48 trades) on unseen 2024-26 -> NOT added (failed the pre-set group rule).
    # Across all 8 coins, 2024-26 was only ~+0.04R, so the BTC/ETH/XRP edge is fragile.
    # 2026-10-22 re-test (scripts/research.py, Elev8 MT5 data): BTC/ETH +0.41R in-sample,
    # +0.26R unseen. 3 coins: 0.32%/month at 1% risk, worst fall 10%.
  - name: commodity_trend
    strategy: daily_trend
    symbols: [XAUUSD, XAGUSD, XBRUSD, XTIUSD]
    horizon: LONG-TERM
    tier: "Promising (demo): profitable 2019-23 and on unseen 2024-26, even at double costs; not yet statistically proven"
    stats: "Tested on Elev8 prices 2019-2026: about 11 trades a year across gold, silver, Brent and WTI oil; +0.28x risk per trade 2019-23 and +0.65x on unseen 2024-26. Silver alone was slightly negative."
    # Added 2026-11-19 at the user's request after scripts/research_trend.py (55-day): 63 trades
    # +0.28R in-sample, 23 trades +0.65R unseen, +0.36R at 2x costs; group t = 1.8 (< the strict 3.0
    # bar), so labelled promising. Per market (all years): XAU +0.42R, XBR +0.62R, XTI +0.47R, XAG -0.05R.
    # Silver kept: the group was the unit tested (dropping it after seeing results = overfitting).
    # Random-day control (2026-11-20, same stops, same number of trades, random entry days and
    # directions, 20 tries): random matched the breakout only 5% (2019-23) / 15% (2024-26) of the
    # time -> the breakout timing is real here. Crypto: 60% / 10% (partly just the 2019-23 bull run).

  # NOT ADDED 2026-11-20: every other Elev8 market (scripts/research_all.py, 66 markets that are
  # fully tradeable with history and low costs; 29 shares are close-only on Elev8, most coins and
  # the extra forex crosses have only one year of history, the exotics are close-only).
  #   US shares (57) buy-only "passed" (20/55/100-day: +0.26/+0.22/+0.25R, t 5.0/3.7/3.8), BUT buying
  #   the same shares on RANDOM days with the same stops made +0.30R: the result is just US shares
  #   (today's survivors) rising 2019-26, not a signal. Shares outside the US (9): 20-day buy-only
  #   +0.27/+0.23R, random +0.30/+0.44R -> same. Both directions lost. Other coins (LTC/BCH/AAVE):
  #   -0.2 to -0.4R. Natural gas: -0.5 to -0.8R on unseen 2024-26.

  # ---- ⚗️ EXPERIMENTAL feeds: off 2026-10-22 (user: "tested winning signals" only), back on
  # 2026-11-23 at the user's request for demo practice. None passed testing:
  # fx_gold_trend: EUR/GBP -0.41R on unseen 2024-26. Gold dropped from it: commodity_trend already
  #   sends the same daily_trend signal on XAUUSD, so it would arrive twice.
  # x_crypto_breakout (BTC/ETH): -0.04R in-sample, -$326 live (Oct).
  # x_crypto_pullback (M15 BTC/ETH): -0.13R over 3,663 trades 2019-26.
  # x_fx_ny_range (XAU/EUR/GBP): -0.16R in-sample, -$392 live (Oct).
  - name: fx_gold_trend
    strategy: daily_trend
    symbols: [EURUSD, GBPUSD]
    horizon: LONG-TERM
    tier: "⚗️ EXPERIMENTAL, failed testing (unseen 2024-26: about -0.4x risk per trade)"
    stats: "Daily trend breakout on EUR/USD and GBP/USD. Demo only. Testing says this loses on average."
    experimental: true
  - name: x_crypto_breakout
    strategy: london_breakout
    symbols: [BTCUSD, ETHUSD]
    horizon: INTRADAY
    tier: "⚗️ EXPERIMENTAL, unproven (2019-23 test: about -0.04x risk per trade)"
    stats: "Breakout of the quiet overnight range when London opens. Demo only. Testing says this slightly loses on average."
    experimental: true
  - name: x_crypto_pullback
    strategy: trend_pullback
    symbols: [BTCUSD, ETHUSD]
    horizon: INTRADAY
    tier: "⚗️ EXPERIMENTAL, unproven (2019-26 test: about -0.13x risk per trade)"
    stats: "Buy the dip in an uptrend / sell the bounce in a downtrend on the 15-minute chart. Demo only. Testing says this loses on average."
    params: {timeframe: M15, max_hold_bars: 32, expiry_bars: 8, cooldown_bars: 8}
    experimental: true
  - name: x_fx_ny_range
    strategy: london_breakout
    symbols: [XAUUSD, EURUSD, GBPUSD]
    horizon: INTRADAY
    tier: "⚗️ EXPERIMENTAL, unproven (2019-23 test: about -0.16x risk per trade)"
    stats: "Breakout of the 8:00-9:30am New York range (8pm-9:30pm Malaysia), around US data time. Demo only. Testing says this loses on average."
    params: {timeframe: M15, session_tz: America/New_York, range_start: "08:00", range_end: "09:30",
             entry_deadline: "12:00", close_time: "15:30", min_range_atr: 0.1, max_range_atr: 0.8}
    experimental: true

# Grok experiment (started 2026-11-19, user's request): once a day Grok gives an up/down/none call for
# the next 24 h per market. PAPER ONLY: logged in state/grok_calls.csv and scored vs a coin flip and the
# plain trend direction (/grok, report card). Never a signal. Needs XAI_API_KEY in .env. ~US$0.01/day.
grok:
  enabled: true
  model: grok-4.7
  symbols: [BTCUSD, ETHUSD, XRPUSD, XAUUSD]
  time: "08:10"                # local time, after the morning message

# ⚗️ Grok AI trade signals (2026-11-23, user's request: real trades, no cap on how many). Every hour
# Grok sees the live Elev8 candles and proposes exact trades; the bot's guard rules
# (forexbot/grok_trades.py) decide what is sent. UNTESTED: judged live on demo. 1% risk like the others.
grok_trades:
  enabled: true
  model: grok-4.7
  every_minutes: 60
  symbols: [BTCUSD, ETHUSD, XRPUSD, XAUUSD, XAGUSD, XBRUSD, XTIUSD, EURUSD, GBPUSD]
  price_in_per_m: 2.0          # US$ per million tokens (xAI /v1/language-models, grok-4.7, 2026-11-23)
  price_out_per_m: 6.0
  daily_budget_usd: 1.0        # no more calls that day once spent (expected ~US$0.50/day)
  pause_after_trades: 10       # pause once 10+ finished trades average below -0.2x risk...
  pause_below_r: -0.2
  pause_loss_r: 5              # ...or the Grok trades have lost 5x risk (~5% of the account) in total
  rules: {with_trend_only: true, min_reward_risk: 1.5, min_stop_atr: 0.5, max_stop_atr: 3.0,
          min_stop_spreads: 10, min_confidence: 60, news_minutes: 30, max_valid_minutes: 240,
          max_hold_hours: 24, max_entry_atr: 1.5}
  tier: "⚗️ EXPERIMENTAL: Grok AI's own trade, untested (no honest backtest exists for an AI model)"
  stats: "Grok reads the live 1-hour and 15-minute candles every hour. The bot only sends trades with the daily trend, a target at least 1.5x the stop and no big news due. Demo only."

# Monthly growth target shown in the report card (actual vs target). A target, not a forecast:
# no tested strategy reaches 2% a month at sensible risk (see crypto_trend notes above).
targets:
  monthly_return_pct: 2.0
  tested_monthly_pct: 0.6      # 2019-26 tests of the live feeds at 1% risk: crypto ~12 tr/yr x +0.35R + metals & oil ~11 tr/yr x +0.3R

# If auto-detection picks the wrong broker symbol, map it here, e.g. XAUUSD: XAUUSD.std
symbol_map: {}

